[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glideit"
dynamic = ["version"]
description = "CLI tool that parses a Python/JSX codebase and produces an interactive visual graph"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "abhishekmohite55", email = "abhishekmohite55@gmail.com" }]
keywords = ["codebase", "visualization", "cli", "ast", "graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "tree-sitter>=0.22,<0.24",
    "tree-sitter-python>=0.22,<0.24",
    "tree-sitter-javascript>=0.22,<0.24",
    "tree-sitter-typescript>=0.22,<0.24",
    "pathspec>=0.12",
]

[project.urls]
Homepage = "https://github.com/abhishekmohite55/GlideIt"
"Bug Tracker" = "https://github.com/abhishekmohite55/GlideIt/issues"
Source = "https://github.com/abhishekmohite55/GlideIt"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
glideit = "glideit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["glideit*"]

[tool.setuptools.dynamic]
version = {attr = "glideit.__version__"}

[tool.setuptools.package-data]
glideit = ["renderer/dist/**/*", "renderer/dist-single/**/*", "skills/**/*"]
