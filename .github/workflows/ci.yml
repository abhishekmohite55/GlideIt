name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Python lint and test ───────────────────────────────────────────
  python:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e .
          pip install ruff pytest

      - name: Lint with ruff
        run: ruff check glideit/ tests/

      - name: Run tests
        run: pytest tests/ -v

  # ─── Renderer build check ───────────────────────────────────────────
  renderer:
    name: Renderer Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: glideit/renderer/package-lock.json

      - name: Install npm dependencies
        working-directory: glideit/renderer
        run: npm ci

      - name: Build renderer
        working-directory: glideit/renderer
        run: npm run build

      - name: Verify dist exists
        run: test -d glideit/renderer/dist && echo "✅ dist/ exists"
